<div class="absolute inset-0 bg-[url('/logingallinas.jpeg')] bg-center bg-cover"></div>
<div class="absolute inset-0 bg-black/50"></div>
<div class="relative z-10 h-full w-full flex items-center justify-center">
  <div class="bg-white border border-[#e3e8ea] rounded-[18px] px-16 py-[26px] w-[600px] max-[480px]:w-[90%] max-[480px]:px-[22px] max-[480px]:py-[30px] shadow-[0_24px_70px_rgba(0,0,0,0.45)] animate-[cardIn_0.35s_cubic-bezier(0.22,0.68,0,1.3)]">

    <div class="flex justify-center mb-[10px]">
      <div class="w-[88px] h-[88px] rounded-full border-[2px] border-[#39b54a] overflow-hidden shadow-[0_4px_16px_rgba(57,181,74,0.35)]">
        <img class="w-full h-full object-cover" src="logoverde.jpeg" alt="Logo SENA">
      </div>
    </div>

    <div class="text-center text-[32px] font-extrabold text-[#2c3e50] mb-2">Zona Avícola SENA</div>
    <div class="text-center text-[15px] text-[#7f8c8d] mb-[14px]">Sistema de Gestión Avícola</div>

    <label class="block text-[13px] font-bold text-[#7f8c8d] uppercase tracking-[0.5px] mb-[7px]">Usuario</label>
    <div class="bg-[#f8f9fa] border-2 rounded-[11px] px-4 py-[18px] flex items-center gap-3 mb-4 transition-colors duration-[180ms]"
         [class]="wrapUserErr ? 'border-[#e53935]' : 'border-[#dfe4ea] focus-within:border-[#39b54a] focus-within:bg-[#f0fff4]'">
      <span class="flex items-center flex-shrink-0" [class]="wrapUserErr ? 'text-[#e53935]' : 'text-[#7f8c8d]'" [innerHTML]="svgUser"></span>
      <input class="flex-1 border-none bg-transparent text-base text-[#333] outline-none placeholder:text-[#b2bec3]" [(ngModel)]="username" type="text" placeholder="Usuario"
        autocomplete="off" (input)="clearError()" (keydown)="onKeyUser($event, passInput)">
    </div>

    <label class="block text-[13px] font-bold text-[#7f8c8d] uppercase tracking-[0.5px] mb-[7px]">Contraseña</label>
    <div class="bg-[#f8f9fa] border-2 rounded-[11px] px-4 py-[18px] flex items-center gap-3 mb-4 transition-colors duration-[180ms]"
         [class]="wrapPassErr ? 'border-[#e53935]' : 'border-[#dfe4ea] focus-within:border-[#39b54a] focus-within:bg-[#f0fff4]'">
      <span class="flex items-center flex-shrink-0" [class]="wrapPassErr ? 'text-[#e53935]' : 'text-[#7f8c8d]'" [innerHTML]="svgLock"></span>
      <input #passInput class="flex-1 border-none bg-transparent text-base text-[#333] outline-none placeholder:text-[#b2bec3]" [(ngModel)]="password"
        [type]="showPass ? 'text' : 'password'" placeholder="Ingrese su contraseña"
        (input)="clearError()" (keydown)="onKey($event)">
      <button class="relative z-10 bg-transparent border-none cursor-pointer flex items-center text-[#95a5a6] p-0 transition-colors duration-150 hover:text-[#39b54a]" type="button" (click)="showPass = !showPass"
        [attr.title]="showPass ? 'Ocultar contraseña' : 'Mostrar contraseña'"
        [innerHTML]="showPass ? svgEyeOff : svgEye">
      </button>
    </div>

    @if (errorVisible) {
      <div class="bg-[#ffebee] border border-[#ef5350] rounded-[9px] px-4 py-3 flex items-center gap-[10px] mb-4 animate-[shake_0.35s_ease]">
        <span class="flex items-center text-[#e53935] flex-shrink-0" [innerHTML]="svgWarning"></span>
        <span class="text-sm text-[#c62828]">{{errorMsg}}</span>
      </div>
    }

    <button class="w-full py-5 bg-[#39b54a] text-white border-none rounded-[11px] text-base font-extrabold tracking-[0.5px] cursor-pointer mb-2 transition-[background,transform] duration-150 hover:bg-[#2e9940] disabled:bg-[#ccc] disabled:cursor-not-allowed" type="button" (click)="doLogin()" [disabled]="loading">
      {{loading ? 'Ingresando...' : 'INICIAR SESIÓN'}}
    </button>

    <!-- acceso sin cuenta, solo lectura -->
    <button class="w-full p-[18px] bg-transparent text-[#7f8c8d] border-2 border-[#dfe4ea] rounded-[11px] text-sm font-semibold cursor-pointer mb-4 transition-colors duration-150 hover:border-[#39b54a] hover:text-[#39b54a]" type="button" (click)="entrarComoVisitante()">
       Entrar como visitante
    </button>

    <div class="h-px bg-[#e8eaed] mb-[10px]"></div>
    <div class="text-center text-[11.5px] text-[#b2bec3]">© 2026 Avícola SENA — Sistema de Gestión Avícola</div>

  </div>
</div>
